# SonarQube / SonarCloud configuration.
#
# IMPORTANT — C++ analysis licensing:
#   Sonar's own C/C++/Objective-C analyzer (CFamily) is a COMMERCIAL feature.
#   SonarQube Community Edition cannot analyse the C++ in src/ with it.
#   Your options:
#     1. Free path (what this repo uses by default): scripts/static-analysis.sh
#        runs clang-tidy + cppcheck. Reports land in analysis/ and are the
#        actual quality gate — they need no Sonar server at all.
#     2. Community-plugin path: install the third-party sonar-cxx plugin on a
#        Community server; it imports the clang-tidy/cppcheck reports below.
#     3. Commercial path: SonarQube Developer Edition or SonarCloud (free for
#        public repos), which enables the real CFamily analyzer via
#        build-wrapper — see the commented block at the bottom.
#
# The mcp/ JavaScript IS analysable on Community Edition out of the box.

sonar.projectKey=eurydice
sonar.projectName=Eurydice DAW
sonar.projectVersion=0.1.0

sonar.sources=src,mcp
sonar.tests=tests
sonar.exclusions=build/**,build-cov/**,mcp/node_modules/**
sonar.sourceEncoding=UTF-8

# --- option 2: sonar-cxx plugin importing our free-tool reports ---
sonar.cxx.clangtidy.reportPaths=analysis/clang-tidy.txt
sonar.cxx.cppcheck.reportPaths=analysis/cppcheck.xml
sonar.cxx.file.suffixes=.cpp,.h

# --- option 3: commercial CFamily analyzer ---
# Generate the build wrapper output first:
#   build-wrapper-macosx-x86 --out-dir bw-output cmake --build build --clean-first
# then uncomment:
# sonar.cfamily.build-wrapper-output=bw-output
# sonar.cfamily.threads=8
